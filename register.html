<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Online Crime Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .register-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>🛡️ Create Account</h1>

        <p class="subtitle">
            Online Crime Detection System
        </p>

        <form id="registerForm">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                minlength="6"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>


    <script>

        const form = document.getElementById("registerForm");

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            name,
                            email,
                            password
                        })
                    }
                );

                const data = await response.json();

                if (data.success) {

    message.style.color = "green";

    message.textContent =
        "✅ Registration successful!";

    form.reset();

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1000);

} else {

                    message.style.color = "red";

                    message.textContent =
                        "❌ " + data.message;
                }

            } catch (error) {

                message.style.color = "red";

                message.textContent =
                    "❌ Cannot connect to server.";

                console.error(error);
            }

        });

    </script>

</body>
</html>
