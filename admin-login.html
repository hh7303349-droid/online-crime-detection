<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px #0002;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🛡️ Admin Login</h1>

        <form id="adminLoginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="admin@gmail.com"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Admin@123"
                required
            >

            <button type="submit">
                Admin Login
            </button>

        </form>

        <div id="message"></div>

        <div class="back">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>

        document
            .getElementById("adminLoginForm")
            .addEventListener("submit", async function(e) {

                e.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const response = await fetch(
                        "http://localhost:5000/api/auth/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );

                    const data = await response.json();

                    if (data.success) {

                        localStorage.setItem(
                            "token",
                            data.token
                        );

                        localStorage.setItem(
                            "user",
                            JSON.stringify(data.user)
                        );

                        message.style.color = "green";

                        message.textContent =
                            "✅ Admin login successful";

                        setTimeout(() => {
                            window.location.href =
                                "admin.html";
                        }, 800);

                    } else {

                        message.style.color = "red";

                        message.textContent =
                            "❌ " + data.message;
                    }

                } catch (error) {

                    message.style.color = "red";

                    message.textContent =
                        "❌ Cannot connect to server.";

                    console.error(error);
                }

            });

    </script>

</body>

</html>
