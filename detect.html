<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crime Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e293b;
        }

        .description {
            color: #64748b;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
            margin-top: 15px;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .detect-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .detect-btn:hover {
            background: #1d4ed8;
        }

        #loading {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .high {
            background: #fee2e2;
            border: 1px solid #ef4444;
        }

        .medium {
            background: #fef3c7;
            border: 1px solid #f59e0b;
        }

        .low {
            background: #dcfce7;
            border: 1px solid #22c55e;
        }

        .result-title {
            font-size: 22px;
            font-weight: bold;
        }

        .keywords {
            margin-top: 15px;
        }

        .keyword {
            display: inline-block;
            background: #e2e8f0;
            padding: 6px 10px;
            margin: 4px;
            border-radius: 15px;
            font-size: 13px;
        }
    </style>

</head>

<body>

    <header>

        <h2>🛡️ Online Crime Detection</h2>

        <button
            class="back-btn"
            onclick="goDashboard()"
        >
            Dashboard
        </button>

    </header>


    <div class="container">

        <div class="box">

            <h1>🔍 Online Crime Detection</h1>

            <p class="description">
                Enter a suspicious message, SMS, email or online content.
                The system will analyse it and identify the possible risk level.
            </p>


            <textarea
                id="crimeText"
                placeholder="Example: Congratulations! You won a lottery. Click here to claim your prize. Verify your account and share OTP."
            ></textarea>


            <button
                class="detect-btn"
                onclick="detectCrime()"
            >
                🔍 Detect Crime
            </button>


            <div id="loading">
                ⏳ Analysing message...
            </div>


            <div id="result">

                <div
                    class="result-title"
                    id="riskLevel"
                ></div>


                <p>
                    <strong>Category:</strong>
                    <span id="category"></span>
                </p>


                <p>
                    <strong>Confidence:</strong>
                    <span id="confidence"></span>
                </p>


                <div class="keywords">

                    <strong>
                        Suspicious Keywords:
                    </strong>

                    <div id="keywordList"></div>

                </div>


                <p>
                    <strong>
                        Recommendation:
                    </strong>

                    <span id="recommendation"></span>
                </p>

            </div>

        </div>

    </div>


    <script>

        async function detectCrime() {

            const text =
                document
                    .getElementById("crimeText")
                    .value
                    .trim();


            const result =
                document.getElementById("result");


            const loading =
                document.getElementById("loading");


            // Empty message check
            if (!text) {

                alert(
                    "Please enter a message."
                );

                return;
            }


            result.style.display = "none";

            loading.style.display = "block";


            try {

                // Get logged-in user
                const user =
                    JSON.parse(
                        localStorage.getItem("user")
                    );
                    console.log("Logged user:", user);
console.log("User ID:", user?._id || user?.id);


                // Check login
                if (!user) {

                    alert(
                        "Please login first."
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                // Get User ID
                const userId =
                    user._id || user.id;


                // Check User ID
                if (!userId) {

                    alert(
                        "User ID not found. Please login again."
                    );

                    localStorage.removeItem("user");
                    localStorage.removeItem("token");

                    window.location.href =
                        "login.html";

                    return;
                }


                // Send message to backend
                const response =
                    await fetch(
                        "http://localhost:5000/api/detect",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                text: text,

                                userId: userId

                            })
                        }
                    );


                const data =
                    await response.json();


                loading.style.display =
                    "none";


                // Backend error
                if (!data.success) {

                    alert(
                        data.message
                    );

                    return;
                }


                // Detection result
                const detection =
                    data.result;


                // Risk Level
                document
                    .getElementById("riskLevel")
                    .textContent =
                    "🚨 Risk Level: " +
                    detection.riskLevel;


                // Category
                document
                    .getElementById("category")
                    .textContent =
                    detection.category;


                // Confidence
                document
                    .getElementById("confidence")
                    .textContent =
                    detection.confidence;


                // Recommendation
                document
                    .getElementById("recommendation")
                    .textContent =
                    detection.recommendation;


                // Clear old keywords
                const keywordList =
                    document.getElementById(
                        "keywordList"
                    );

                keywordList.innerHTML = "";


                // Display keywords
                detection
                    .suspiciousKeywords
                    .forEach(keyword => {

                        const span =
                            document.createElement(
                                "span"
                            );

                        span.className =
                            "keyword";

                        span.textContent =
                            keyword;

                        keywordList.appendChild(
                            span
                        );

                    });


                // Result box style
                result.className = "";


                if (
                    detection.riskLevel ===
                    "HIGH"
                ) {

                    result.classList.add(
                        "high"
                    );

                } else if (
                    detection.riskLevel ===
                    "MEDIUM"
                ) {

                    result.classList.add(
                        "medium"
                    );

                } else {

                    result.classList.add(
                        "low"
                    );

                }


                // Show result
                result.style.display =
                    "block";


            } catch (error) {

                loading.style.display =
                    "none";

                alert(
                    "Cannot connect to backend server."
                );

                console.error(error);

            }

        }


        // Dashboard button
        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }

    </script>

</body>

</html>
