<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Online Crime Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .profile-box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e293b;
            text-align: center;
        }

        .profile-item {
            padding: 15px;
            margin-top: 15px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .profile-item strong {
            color: #334155;
        }

        .profile-item span {
            color: #64748b;
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <header>

        <h2>🛡️ Online Crime Detection</h2>

        <button class="back-btn" onclick="goDashboard()">
            Dashboard
        </button>

    </header>


    <div class="container">

        <div class="profile-box">

            <h1>👤 My Profile</h1>

            <div class="profile-item">
                <strong>Name:</strong>
                <span id="name">-</span>
            </div>

            <div class="profile-item">
                <strong>Email:</strong>
                <span id="email">-</span>
            </div>

        </div>

    </div>


    <script>

        const token = localStorage.getItem("token");

        const user = JSON.parse(
            localStorage.getItem("user")
        );


        // Check login
        if (!token || !user) {

            window.location.href = "login.html";

        }


        // Display user details
        if (user) {

            document.getElementById("name")
                .textContent = user.name || "Not available";

            document.getElementById("email")
                .textContent = user.email || "Not available";

        }


        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }

    </script>

</body>

</html>
